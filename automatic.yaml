# Stuff which needs to be added to the docs
#
# Available Libary types:
# - single-header
# - header+source

fltk:
  repos:
    fltk:
      cppstd: 11
      license: FLTK License
      description: "FLTK - Fast Light Tool Kit - https://github.com/fltk/fltk - cross platform GUI development"
      language: C++

glfw:
  repos:
    glfw:
      license: zlib
      language: C
      description: "A multi-platform library for OpenGL, OpenGL ES, Vulkan, window and input"

immediate-mode-ui:
  repos:
    nuklear:
      description: "A single-header ANSI C immediate mode cross-platform GUI library"
      language: C

jbeder:
  repos:
    yaml-cpp:
      description: "A YAML parser and emitter in C++"
      language: C++
      license: MIT
      cppstd: 11

#
# meemknight
